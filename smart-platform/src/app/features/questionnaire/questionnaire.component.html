<section class="page-card p-4 p-md-5">
  <h1 class="h3 text-primary mb-2">Questionnaire</h1>
  <p class="text-secondary mb-4">Answer guided questions and we will prepare your ITR draft automatically.</p>

  <div class="timeline">
    <div class="timeline-item d-flex gap-3 align-items-start" *ngFor="let step of steps; index as i">
      <span class="step-dot">{{ i + 1 }}</span>
      <div class="pb-3">
        <h2 class="h6 mb-1">{{ step }}</h2>
        <p class="small text-muted mb-0">Complete this section to move to the next step.</p>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a class="btn btn-primary me-2" routerLink="/digilocker">Connect DigiLocker</a>
    <a class="btn btn-outline-primary" routerLink="/summary">Go to Summary</a>
  </div>
</section>

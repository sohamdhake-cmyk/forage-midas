<section class="page-card p-4 p-md-5">
  <h1 class="h3 text-primary mb-2">Return Summary</h1>
  <p class="text-secondary mb-4">Review your calculated values before final submission.</p>

  <div class="table-responsive mb-4">
    <table class="table align-middle mb-0">
      <tbody>
        <tr *ngFor="let item of items">
          <th class="text-muted fw-medium">{{ item.label }}</th>
          <td class="text-end fw-semibold">{{ item.value }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-success">Submit ITR</button>
    <a class="btn btn-outline-primary" routerLink="/questionnaire">Edit Details</a>
  </div>
</section>

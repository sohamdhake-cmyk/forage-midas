<section class="page-card p-4 p-md-5" *ngIf="vm$ | async as vm">
  <h1 class="h3 text-primary mb-2">Return Summary</h1>
  <p class="text-secondary mb-4">Review your calculated values, {{ vm.userName }}, before final submission.</p>

  <div class="alert alert-warning mb-4" *ngIf="!vm.hasData" role="alert">
    No questionnaire data found yet. Please complete the questionnaire first.
  </div>

  <div class="table-responsive mb-4" *ngIf="vm.hasData">
    <table class="table align-middle mb-0">
      <tbody>
        <tr *ngFor="let item of vm.items">
          <th class="text-muted fw-medium">{{ item.label }}</th>
          <td class="text-end fw-semibold">{{ item.value }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-success" [disabled]="!vm.hasData">Submit ITR</button>
    <a class="btn btn-outline-primary" routerLink="/questionnaire">Edit Details</a>
  </div>
</section>
